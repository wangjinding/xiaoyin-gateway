# 智能体定义（内嵌 DeepSeek Harness）
#
# 说明：
#   · 执行与界面都在内嵌的 DeepSeek Harness 里（/agent/），网关只做登记与权限。
#   · 模型在 DSH 里选（下拉就是网关自己的模型），本文件不涉及模型配置。
#   · 本文件不含秘密，可入版本库。
#   · 归档（status: retired）不计入 max_agents 上限。

max_agents: 5

agents:
  dsh-assistant:
    display_name: 小银助手
    description: 跑在网关自带的 DeepSeek Harness 上，插件/文件/终端/会话全套
    params: {}
    access:
      roles:
      - admin
      users: []
    status: published
    created_at: '2026-11-23 19:30:00'
    updated_at: '2026-11-23 23:35:00'
