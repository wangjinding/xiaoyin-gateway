aliases:
  wjd:
    enabled: true
    target: deepseek-v4.1-flash
    note: 老板的固定入口（默认指向旗舰，随时可在模型页改）
server:
  host: 127.0.0.1
  port: 8808
  timeout: 120
  retry: 3
  health_auth: false
  hot_reload: true
  hot_reload_interval: 15
  metrics_enabled: true
  rate_limit_rps: 50
  max_body_size: 20000000
  cors_origins:
  - http://127.0.0.1:8808
  - http://localhost:8808
  - http://127.0.0.1:5173
  - http://localhost:5173
  graceful_shutdown: 30
  batch_max_concurrency: 16
  batch_max_items: 64
  webhook_allow_private: false
  docs_enabled: false
  auth_fail_limit_per_min: 60
  auth_fail_ban_seconds: 3600
circuit:
  enabled: true
  failure_threshold: 3
  cooldown: 30
  window: 10
observability:
  log_level: INFO
  log_json: false
  access_log_maxlen: 500
pricing:
  per_model:
    agnes-3.0-flash:
      input: 0
      output: 0
    agnes-2.5-pro:
      input: 3
      output: 6
    agnes-2.5-pro-beta:
      input: 0.7
      output: 2.1
    agnes-2.5-pro-theta:
      input: 0.7
      output: 2
download:
  allowed_hosts:
  - cos-platform-outputs.agnes-ai.cn
  - maas-watermark-prod-new.cn-wlcb.ufileos.com
  max_bytes: 67108864
auth:
  session_ttl_minutes: 1440
